<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armador de Prompts · Sento</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f4f0;
    --surface: #ffffff;
    --surface2: #f0efe9;
    --border: #d8d6cc;
    --border2: #c8c6bb;
    --text: #1a1a18;
    --text2: #5a5950;
    --text3: #8a8878;
    --accent: #2d6a4f;
    --accent-light: #e8f5ee;
    --accent-border: #a8d5b8;
    --danger: #c0392b;
    --danger-light: #fdf0ee;
    --mono: 'IBM Plex Mono', monospace;
    --sans: 'IBM Plex Sans', sans-serif;
    --radius: 6px;
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
    height: 52px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: var(--accent);
    text-transform: uppercase;
    display: flex;
    align-items: center;
  }

  .tabs {
    display: flex;
    align-items: stretch;
    gap: 0;
    margin-left: 2rem;
  }

  .tab {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--text3);
    padding: 0 18px;
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 2px solid transparent;
    display: flex;
    align-items: center;
    gap: 7px;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .tab:hover { color: var(--text2); background: var(--surface2); }
  .tab:active { transform: none; }

  .tab.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
    background: none;
  }

  .tab-badge {
    background: var(--accent-light);
    color: var(--accent);
    border: 1px solid var(--accent-border);
    border-radius: 10px;
    font-size: 10px;
    padding: 1px 6px;
    font-weight: 500;
  }

  .tab-badge.hidden { display: none; }

  .header-right {
    display: flex;
    align-items: center;
  }

  .counter {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text3);
    padding: 3px 9px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 2rem 1.5rem 4rem;
  }

  .page-title {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .page-subtitle {
    font-size: 14px;
    color: var(--text3);
    font-family: var(--mono);
    margin-bottom: 2rem;
  }

  /* ── ARMADOR ── */

  .prompt-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 1rem;
    overflow: hidden;
  }

  .card-header {
    display: flex;
    align-items: center;
    padding: 0.875rem 1.25rem;
    cursor: pointer;
    user-select: none;
    gap: 12px;
    transition: background 0.1s;
  }

  .card-header:hover { background: var(--surface2); }

  .card-number {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    color: var(--text3);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 2px 7px;
    min-width: 32px;
    text-align: center;
  }

  .card-name { flex: 1; font-size: 14px; font-weight: 500; color: var(--text); }
  .card-name.empty { color: var(--text3); font-weight: 400; font-style: italic; }

  .card-status { display: flex; gap: 6px; align-items: center; }

  .status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--border);
  }
  .status-dot.filled { background: var(--accent); }

  .chevron { color: var(--text3); font-size: 11px; transition: transform 0.2s; margin-left: 4px; }
  .expanded .chevron { transform: rotate(180deg); }

  .card-body { display: none; padding: 0 1.25rem 1.25rem; border-top: 1px solid var(--border); }
  .expanded .card-body { display: block; }

  .field-group { margin-top: 1rem; }

  label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 6px;
    font-family: var(--mono);
  }

  input[type="text"], textarea {
    width: 100%;
    font-family: var(--sans);
    font-size: 14px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px 12px;
    outline: none;
    resize: vertical;
    transition: border-color 0.15s;
  }

  input[type="text"]:focus, textarea:focus {
    border-color: var(--accent);
    background: var(--surface);
  }

  textarea { min-height: 90px; line-height: 1.6; }

  .files-zone {
    border: 1.5px dashed var(--border2);
    border-radius: var(--radius);
    padding: 1rem;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    background: var(--bg);
    position: relative;
  }

  .files-zone:hover, .files-zone.dragover {
    border-color: var(--accent);
    background: var(--accent-light);
  }

  .files-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
  }

  .files-zone-text { font-size: 13px; color: var(--text3); pointer-events: none; }
  .files-zone-text strong { color: var(--accent); font-weight: 500; }

  .files-list { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }

  .file-chip {
    display: flex; align-items: center; gap: 5px;
    background: var(--accent-light);
    border: 1px solid var(--accent-border);
    border-radius: 4px;
    padding: 3px 8px;
    font-size: 12px;
    color: var(--accent);
    font-family: var(--mono);
  }

  .file-chip-remove {
    cursor: pointer; color: var(--accent); opacity: 0.6;
    font-size: 14px; line-height: 1; border: none; background: none; padding: 0;
  }
  .file-chip-remove:hover { opacity: 1; }

  .card-actions {
    display: flex; justify-content: flex-end; gap: 8px;
    margin-top: 1rem; padding-top: 1rem;
    border-top: 1px solid var(--border);
  }

  button {
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    border-radius: var(--radius); cursor: pointer; transition: all 0.1s;
    border: 1px solid var(--border); padding: 7px 14px;
    background: var(--surface); color: var(--text);
  }

  button:hover { background: var(--surface2); border-color: var(--border2); }
  button:active { transform: scale(0.98); }

  .btn-danger { color: var(--danger); border-color: #f0c0b8; background: var(--danger-light); }
  .btn-danger:hover { background: #f9e0dc; border-color: #e0a090; color: var(--danger); }

  .btn-accent {
    background: var(--accent); color: white; border-color: var(--accent);
  }
  .btn-accent:hover { background: #245a40; border-color: #245a40; color: white; }
  .btn-accent:disabled { opacity: 0.4; cursor: not-allowed; }

  .btn-copy {
    color: var(--accent); border-color: var(--accent-border); background: var(--accent-light);
    padding: 5px 10px; font-size: 12px;
  }
  .btn-copy:hover { background: #d0eddc; border-color: var(--accent); color: var(--accent); }

  .add-prompt-btn {
    width: 100%; padding: 10px;
    border: 1.5px dashed var(--border2);
    background: transparent; color: var(--text3);
    font-size: 13px; border-radius: 8px; margin-top: 0.25rem;
  }
  .add-prompt-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }

  .generate-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--surface); border-top: 1px solid var(--border);
    padding: 0.875rem 2rem;
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    z-index: 100;
  }

  .generate-bar.hidden { display: none; }

  .generate-info { font-size: 13px; color: var(--text3); font-family: var(--mono); }

  .output-section { margin-top: 2rem; display: none; }
  .output-section.visible { display: block; }

  .output-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }

  .output-label {
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em;
  }

  .output-box {
    background: #1a1a18; color: #e8e6dd;
    font-family: var(--mono); font-size: 12.5px; line-height: 1.7;
    padding: 1.25rem; border-radius: 8px;
    white-space: pre-wrap; word-break: break-word;
    max-height: 600px; overflow-y: auto;
    border: 1px solid #333;
  }

  /* ── LIBRETA ── */

  .add-form {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
    margin-bottom: 1.5rem;
  }

  .add-form-title {
    font-family: var(--mono); font-size: 11px; font-weight: 500;
    color: var(--text3); text-transform: uppercase; letter-spacing: 0.07em;
    margin-bottom: 1rem;
  }

  .form-row {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 10px;
    align-items: start;
  }

  .form-actions { display: flex; justify-content: flex-end; margin-top: 10px; }

  .section-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
  }

  .section-label {
    font-family: var(--mono); font-size: 12px; font-weight: 500;
    color: var(--text3); text-transform: uppercase; letter-spacing: 0.06em;
  }

  .btn-clear-all {
    font-size: 12px; color: var(--danger);
    border-color: #f0c0b8; background: var(--danger-light); padding: 4px 10px;
  }
  .btn-clear-all:hover { background: #f9e0dc; color: var(--danger); }

  .empty-state {
    text-align: center; padding: 3rem 1rem;
    color: var(--text3); font-size: 14px; font-family: var(--mono);
    border: 1.5px dashed var(--border2); border-radius: 8px;
    background: var(--surface);
  }

  .prompts-list { display: flex; flex-direction: column; gap: 10px; }

  .prompt-item {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .prompt-item-header {
    display: flex; align-items: center; padding: 0.875rem 1.25rem; gap: 12px;
    border-bottom: 1px solid var(--border); background: var(--surface2);
  }

  .prompt-index {
    font-family: var(--mono); font-size: 11px; color: var(--text3);
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 4px; padding: 2px 7px; min-width: 32px; text-align: center;
  }

  .prompt-name-lib { flex: 1; font-size: 14px; font-weight: 500; color: var(--text); }
  .prompt-date { font-family: var(--mono); font-size: 11px; color: var(--text3); }

  .prompt-item-body { padding: 1rem 1.25rem; }

  .prompt-text {
    font-family: var(--mono); font-size: 12.5px; line-height: 1.7; color: var(--text2);
    white-space: pre-wrap; word-break: break-word;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 10px 12px;
    max-height: 200px; overflow-y: auto; margin-bottom: 10px;
  }

  .prompt-item-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .toast {
    position: fixed; top: 1rem; right: 1.5rem;
    background: var(--accent); color: white;
    padding: 8px 16px; border-radius: var(--radius);
    font-size: 13px; font-weight: 500; z-index: 999;
    opacity: 0; transform: translateY(-6px);
    transition: all 0.2s; pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateY(0); }

  @media (max-width: 600px) {
    main { padding: 1.5rem 1rem 4rem; }
    header { padding: 0 1rem; }
    .form-row { grid-template-columns: 1fr; }
    .generate-bar { padding: 0.75rem 1rem; }
  }
</style>
</head>
<body>

<header>
  <div style="display:flex; align-items:center;">
    <div class="logo">Sento · Prompts</div>
    <nav class="tabs">
      <button class="tab active" onclick="switchTab('armador')" id="tab-armador">
        Armador
      </button>
      <button class="tab" onclick="switchTab('libreta')" id="tab-libreta">
        Libreta
        <span class="tab-badge hidden" id="libreta-badge">0</span>
      </button>
    </nav>
  </div>
  <div class="header-right">
    <span class="counter" id="counter">0 prompts</span>
  </div>
</header>

<!-- ══ ARMADOR ══ -->
<div class="tab-panel active" id="panel-armador">
  <main>
    <h1 class="page-title">Armador de prompts</h1>
    <p class="page-subtitle">Agrega tus prompts y sube los CSV de transcripciones</p>
    <div id="prompts-container"></div>
    <button class="add-prompt-btn" onclick="addPrompt()">+ Agregar prompt</button>
    <div class="output-section" id="output-section">
      <div class="output-header">
        <span class="output-label">Documento generado</span>
        <button class="btn-copy" onclick="copyOutput()">Copiar todo</button>
      </div>
      <div class="output-box" id="output-box"></div>
    </div>
  </main>

  <div class="generate-bar" id="generate-bar">
    <span class="generate-info" id="generate-info">Sin prompts aún</span>
    <button class="btn-accent" id="generate-btn" onclick="generateDocument()" disabled>Generar documento</button>
  </div>
</div>

<!-- ══ LIBRETA ══ -->
<div class="tab-panel" id="panel-libreta">
  <main>
    <h1 class="page-title">Prompts nuevos</h1>
    <p class="page-subtitle">Guarda aquí los prompts corregidos mientras trabajas</p>

    <div class="add-form">
      <div class="add-form-title">Agregar prompt nuevo</div>
      <div class="form-row">
        <div>
          <label>Nombre</label>
          <input type="text" id="lib-name" placeholder="ej. Motivo de llamada" />
        </div>
        <div>
          <label>Prompt corregido</label>
          <textarea id="lib-prompt" placeholder="Pega aquí el prompt nuevo que te devolvió Claude..."></textarea>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-accent" onclick="saveLibPrompt()">Guardar</button>
      </div>
    </div>

    <div class="section-header">
      <span class="section-label" id="lib-section-label">Guardados</span>
      <button class="btn-clear-all" id="btn-clear-all" onclick="clearAll()" style="display:none">Eliminar todos</button>
    </div>

    <div id="lib-list"></div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ── TABS ── */
function switchTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');
  document.getElementById('generate-bar').classList.toggle('hidden', name !== 'armador');
}

/* ── ARMADOR ── */
let prompts = [];
let idCounter = 0;

function addPrompt() {
  const id = ++idCounter;
  prompts.push({ id, name: '', current: '', respuesta: '', files: [] });
  renderPrompts();
  setTimeout(() => { const el = document.getElementById('name-' + id); if (el) el.focus(); }, 50);
}

function removePrompt(id) {
  prompts = prompts.filter(p => p.id !== id);
  renderPrompts();
}

function toggleCard(id) {
  document.getElementById('card-' + id).classList.toggle('expanded');
}

function updateField(id, field, value) {
  const p = prompts.find(p => p.id === id);
  if (!p) return;
  p[field] = value;
  updateCardMeta(id);
  updateGenerateBar();
}

function updateCardMeta(id) {
  const p = prompts.find(p => p.id === id);
  if (!p) return;
  const nameEl = document.getElementById('cname-' + id);
  if (nameEl) {
    nameEl.textContent = p.name.trim() || 'Sin nombre';
    nameEl.className = 'card-name' + (p.name.trim() ? '' : ' empty');
  }
  ['cur','res','fil'].forEach((key, i) => {
    const dot = document.getElementById('dot-' + key + '-' + id);
    if (!dot) return;
    const filled = i === 0 ? p.current.trim() : i === 1 ? p.respuesta.trim() : p.files.length > 0;
    dot.className = 'status-dot' + (filled ? ' filled' : '');
  });
}

function handleFiles(id, fileList) {
  const p = prompts.find(p => p.id === id);
  if (!p) return;
  Array.from(fileList).forEach(f => {
    if (f.name.endsWith('.csv') && !p.files.find(x => x.name === f.name)) p.files.push(f);
  });
  renderFileChips(id);
  updateCardMeta(id);
  updateGenerateBar();
}

function removeFile(id, filename) {
  const p = prompts.find(p => p.id === id);
  if (!p) return;
  p.files = p.files.filter(f => f.name !== filename);
  renderFileChips(id);
  updateCardMeta(id);
  updateGenerateBar();
}

function renderFileChips(id) {
  const p = prompts.find(p => p.id === id);
  const c = document.getElementById('flist-' + id);
  if (!p || !c) return;
  c.innerHTML = p.files.map(f => `
    <div class="file-chip">
      <span>${f.name}</span>
      <button class="file-chip-remove" onclick="removeFile(${id},'${f.name}')">×</button>
    </div>`).join('');
}

function updateGenerateBar() {
  const valid = prompts.filter(p => p.name.trim() && p.current.trim() && p.respuesta.trim());
  const total = prompts.length;
  document.getElementById('counter').textContent = total + (total === 1 ? ' prompt' : ' prompts');
  document.getElementById('generate-info').textContent = total === 0 ? 'Sin prompts aún' : `${valid.length} de ${total} completos`;
  document.getElementById('generate-btn').disabled = valid.length === 0;
}

function renderPrompts() {
  document.getElementById('prompts-container').innerHTML = prompts.map((p, i) => `
    <div class="prompt-card expanded" id="card-${p.id}">
      <div class="card-header" onclick="toggleCard(${p.id})">
        <span class="card-number">${String(i+1).padStart(2,'0')}</span>
        <span class="card-name ${p.name ? '' : 'empty'}" id="cname-${p.id}">${p.name || 'Sin nombre'}</span>
        <div class="card-status">
          <div class="status-dot ${p.current ? 'filled':''}" id="dot-cur-${p.id}" title="Prompt actual"></div>
          <div class="status-dot ${p.respuesta ? 'filled':''}" id="dot-res-${p.id}" title="Respuesta predeterminada"></div>
          <div class="status-dot ${p.files.length ? 'filled':''}" id="dot-fil-${p.id}" title="Transcripciones"></div>
        </div>
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="field-group">
          <label>Nombre del prompt</label>
          <input type="text" id="name-${p.id}" value="${esc(p.name)}"
            placeholder="ej. Motivo de llamada, Fecha de pago..."
            oninput="updateField(${p.id},'name',this.value)" />
        </div>
        <div class="field-group">
          <label>Prompt actual</label>
          <textarea id="cur-${p.id}" placeholder="Pega aquí el prompt que está actualmente en producción..."
            oninput="updateField(${p.id},'current',this.value)">${esc(p.current)}</textarea>
        </div>
        <div class="field-group">
          <label>Respuesta predeterminada a estudiar</label>
          <textarea id="res-${p.id}" placeholder="¿Cuál respuesta quieres analizar?"
            oninput="updateField(${p.id},'respuesta',this.value)" style="min-height:70px">${esc(p.respuesta)}</textarea>
        </div>
        <div class="field-group">
          <label>Transcripciones CSV</label>
          <div class="files-zone"
            ondragover="event.preventDefault();this.classList.add('dragover')"
            ondragleave="this.classList.remove('dragover')"
            ondrop="event.preventDefault();this.classList.remove('dragover');handleFiles(${p.id},event.dataTransfer.files)">
            <input type="file" accept=".csv" multiple onchange="handleFiles(${p.id},this.files)" />
            <div class="files-zone-text"><strong>Selecciona varios CSV</strong> o arrástralos aquí</div>
          </div>
          <div class="files-list" id="flist-${p.id}"></div>
        </div>
        <div class="card-actions">
          <button class="btn-danger" onclick="removePrompt(${p.id})">Eliminar prompt</button>
        </div>
      </div>
    </div>`).join('');
  updateGenerateBar();
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

async function parseCSV(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const lines = e.target.result.trim().split('\n');
      if (lines.length < 2) { resolve(''); return; }
      const headers = lines[0].split(',').map(h => h.replace(/"/g,'').trim().toLowerCase());
      const idx = headers.findIndex(h => h.includes('transcripci'));
      if (idx === -1) { resolve(e.target.result); return; }
      const turns = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = parseLine(lines[i]);
        if (cols[idx]) turns.push(cols[idx].replace(/^"|"$/g,'').trim());
      }
      resolve(turns.filter(Boolean).join('\n'));
    };
    reader.readAsText(file, 'utf-8');
  });
}

function parseLine(line) {
  const res = []; let cur = ''; let inQ = false;
  for (let c of line) {
    if (c === '"') { inQ = !inQ; }
    else if (c === ',' && !inQ) { res.push(cur); cur = ''; }
    else cur += c;
  }
  res.push(cur);
  return res;
}

async function generateDocument() {
  const btn = document.getElementById('generate-btn');
  btn.disabled = true; btn.textContent = 'Procesando...';
  const valid = prompts.filter(p => p.name.trim() && p.current.trim() && p.respuesta.trim());
  const parts = [];
  for (let i = 0; i < valid.length; i++) {
    const p = valid[i];
    let b = `══════════════════════════════════════\nPROMPT ${i+1}: ${p.name.toUpperCase()}\n══════════════════════════════════════\n\n`;
    b += `PROMPT ACTUAL:\n${p.current.trim()}\n\n`;
    b += `RESPUESTA PREDETERMINADA A ESTUDIAR:\n${p.respuesta.trim()}\n\n`;
    if (p.files.length > 0) {
      for (let j = 0; j < p.files.length; j++) {
        const t = await parseCSV(p.files[j]);
        b += `──────────────────────────────────────\nEJEMPLO ${j+1} (${p.files[j].name}):\n──────────────────────────────────────\n${t.trim()}\n\n`;
      }
    } else {
      b += `[Sin transcripciones adjuntas]\n\n`;
    }
    parts.push(b);
  }
  document.getElementById('output-box').textContent = parts.join('\n');
  const sec = document.getElementById('output-section');
  sec.classList.add('visible');
  sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  btn.textContent = 'Generar documento';
  updateGenerateBar();
}

function copyOutput() {
  navigator.clipboard.writeText(document.getElementById('output-box').textContent)
    .then(() => showToast('Copiado al portapapeles'));
}

/* ── LIBRETA ── */
const LIB_KEY = 'sento_prompts_v1';

function libLoad() {
  try { return JSON.parse(localStorage.getItem(LIB_KEY)) || []; } catch { return []; }
}

function libSave(d) { localStorage.setItem(LIB_KEY, JSON.stringify(d)); }

function renderLib() {
  const data = libLoad();
  const badge = document.getElementById('libreta-badge');
  badge.textContent = data.length;
  badge.className = 'tab-badge' + (data.length === 0 ? ' hidden' : '');
  document.getElementById('lib-section-label').textContent = `Guardados (${data.length})`;
  document.getElementById('btn-clear-all').style.display = data.length > 1 ? 'block' : 'none';

  const list = document.getElementById('lib-list');
  if (data.length === 0) {
    list.innerHTML = `<div class="empty-state"><div style="font-size:24px;opacity:0.3;margin-bottom:8px">○</div>Aún no hay prompts guardados<div style="margin-top:6px;font-size:12px;opacity:0.7">Agrégalos arriba mientras trabajas con Claude</div></div>`;
    return;
  }
  list.innerHTML = `<div class="prompts-list">${data.map((p,i) => `
    <div class="prompt-item">
      <div class="prompt-item-header">
        <span class="prompt-index">${String(i+1).padStart(2,'0')}</span>
        <span class="prompt-name-lib">${esc(p.name)}</span>
        <span class="prompt-date">${p.date}</span>
      </div>
      <div class="prompt-item-body">
        <div class="prompt-text">${esc(p.text)}</div>
        <div class="prompt-item-actions">
          <button class="btn-copy" onclick="libCopy('${p.id}')">Copiar</button>
          <button class="btn-danger" onclick="libDelete('${p.id}')">Eliminar</button>
        </div>
      </div>
    </div>`).join('')}</div>`;
}

function saveLibPrompt() {
  const name = document.getElementById('lib-name').value.trim();
  const text = document.getElementById('lib-prompt').value.trim();
  if (!name || !text) { showToast('Completa nombre y prompt'); return; }
  const data = libLoad();
  const now = new Date();
  data.unshift({ id: Date.now().toString(), name, text, date: now.toLocaleDateString('es-GT',{day:'2-digit',month:'2-digit',year:'2-digit'}) });
  libSave(data);
  document.getElementById('lib-name').value = '';
  document.getElementById('lib-prompt').value = '';
  renderLib();
  showToast('Prompt guardado');
}

function libDelete(id) {
  libSave(libLoad().filter(p => p.id !== id));
  renderLib();
  showToast('Eliminado');
}

function clearAll() {
  if (!confirm('¿Eliminar todos los prompts guardados?')) return;
  libSave([]); renderLib(); showToast('Libreta limpia');
}

function libCopy(id) {
  const p = libLoad().find(p => p.id === id);
  if (!p) return;
  navigator.clipboard.writeText(p.text).then(() => showToast('Copiado'));
}

/* ── UTILS ── */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

document.getElementById('lib-name').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('lib-prompt').focus();
});

addPrompt();
renderLib();
</script>
